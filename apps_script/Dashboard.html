<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f3f2ef; --card: #ffffff; --text: #191919; --muted: #666666; --line: #e3e1dc; --soft: #f7f6f3;
      --blue: #0a66c2; --blue-dark: #004182; --blue-soft: #e8f1fb;
      --green: #057642; --green-soft: #e5f3ea; --red: #b24020; --red-soft: #fbeae5;
      --amber: #8a5300; --amber-soft: #fdf1dc; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    button, input, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* Sign in */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: 100%; max-width: 380px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 32px 28px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .logo { width: 34px; height: 34px; border-radius: 8px; background: var(--blue); color: #fff; display: grid; place-items: center;
      font-weight: 800; font-size: 17px; letter-spacing: -.5px; flex: none; }
    .login h2 { font-size: 22px; margin: 24px 0 4px; }
    .login p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .field input { width: 100%; padding: 11px 12px; border: 1px solid #b7b5b0; border-radius: 8px; background: #fff; }
    .field input:focus, textarea:focus, input[type=datetime-local]:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
    .error { color: var(--red); font-size: 14px; min-height: 20px; margin-bottom: 8px; }

    /* Buttons */
    .btn { border: 1px solid var(--blue); background: var(--card); color: var(--blue); font-weight: 600; padding: 7px 16px;
      border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--blue-soft); }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.quiet { border-color: transparent; color: var(--muted); }
    .btn.quiet:hover { background: var(--soft); }
    .btn.danger { border-color: transparent; color: var(--red); }
    .btn.danger:hover { background: var(--red-soft); }
    .btn.block { width: 100%; padding: 11px; }
    .btn:disabled { opacity: .5; cursor: default; }

    /* App */
    header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
    .bar { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .bar .brand { flex: 1; min-width: 0; }
    .bar .brand > div:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .short { display: none; }
    .bar .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
    .who { font-size: 13px; color: var(--muted); }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; }
    .stat b { display: block; font-size: 24px; line-height: 1.2; }
    .stat span { font-size: 13px; color: var(--muted); }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
    .tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tab.on { background: var(--text); color: #fff; }
    .tab .n { font-weight: 400; opacity: .8; margin-left: 4px; }
    .hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

    .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
    .card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-head h3 { flex: 1; margin: 0; font-size: 16px; line-height: 1.35; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 400; }
    .pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .pill.review { background: var(--amber-soft); color: var(--amber); }
    .pill.scheduled { background: var(--blue-soft); color: var(--blue); }
    .pill.published { background: var(--green-soft); color: var(--green); }
    .pill.bad { background: var(--red-soft); color: var(--red); }
    .editor { position: relative; }
    textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; background: #fff; }
    textarea[readonly] { background: var(--soft); }
    .count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }
    .count.over { color: var(--red); font-weight: 700; }
    .when { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
    .when label { font-size: 13px; font-weight: 600; }
    .when input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .when .note { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions .spacer { flex: 1; }
    .notes { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 13px; }
    .meta { margin-top: 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .meta a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; z-index: 4; }
    .modal { width: 100%; max-width: 420px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 24px; }
    .modal h2 { margin: 0 0 4px; font-size: 20px; }
    .modal p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .modal .field input { max-width: 180px; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 4px 0 18px; }
    .check input { margin-top: 3px; }
    .modal .actions { justify-content: flex-end; }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--card); border-radius: 12px; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: #fff;
      padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); box-shadow: var(--shadow); z-index: 3; }
    @media (max-width: 560px) {
      .stats { gap: 8px; } .stat { padding: 10px 12px; } .stat b { font-size: 20px; }
      .who, .bar .brand small, .long { display: none; }
      .short { display: inline; }
      .bar { gap: 6px; } .bar .btn { padding: 6px 12px; }
      .tab { padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <!-- Sign in -->
  <div class="login-wrap" id="loginView" hidden>
    <form class="login" id="loginForm">
      <div class="brand"><div class="logo">in</div>LinkedIn Posts</div>
      <h2>Sign in</h2>
      <p>360 Degree Cloud posting dashboard</p>
      <label class="field"><span>Username</span><input id="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
      <div class="error" id="loginError"></div>
      <button class="btn primary block" id="loginBtn">Sign in</button>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="appView" hidden>
    <header>
      <div class="bar">
        <div class="brand"><div class="logo">in</div><div>LinkedIn Posts<small>360 Degree Cloud</small></div></div>
        <span class="who" id="who"></span>
        <button class="btn" id="draftBtn"><span class="long">Write a new draft</span><span class="short">New draft</span></button>
        <button class="btn quiet" id="settingsBtn" title="Settings">⚙<span class="long"> Settings</span></button>
        <button class="btn quiet" id="logoutBtn">Sign out</button>
      </div>
    </header>
    <main>
      <div class="stats">
        <div class="stat"><b id="statReview">0</b><span>To review</span></div>
        <div class="stat"><b id="statScheduled">0</b><span id="statNext">Scheduled</span></div>
        <div class="stat"><b id="statPublished">0</b><span>Published this month</span></div>
      </div>
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <button class="btn quiet" id="refreshBtn" title="Refresh">↻<span class="long"> Refresh</span></button>
      </div>
      <p class="hint" id="hint"></p>
      <div id="list"></div>
    </main>
  </div>
  <div class="modal-bg" id="settingsView" hidden>
    <form class="modal" id="settingsForm">
      <h2>Posting settings</h2>
      <p>Approved posts without their own time go out at the default time, one slot per day up to the daily limit.</p>
      <label class="field"><span>Default post time (IST)</span><input type="time" id="setTime"></label>
      <label class="field"><span>Posts per day, at most</span><input type="number" id="setMax" min="1" max="5" required></label>
      <label class="check"><input type="checkbox" id="setApply"> Also move posts that are already scheduled to the new time</label>
      <div class="actions">
        <button type="button" class="btn quiet" id="settingsCancel">Cancel</button>
        <button class="btn primary" id="settingsSave">Save</button>
      </div>
    </form>
  </div>
  <div id="toast" hidden></div>

  <script>
    const LIMIT = 3000; // LinkedIn's limit for a post.
    const GROUPS = {
      review: { label: 'To review', match: ['Pending review', 'Failed', 'Post manually'] },
      scheduled: { label: 'Scheduled', match: ['Approved', 'Publishing'] },
      published: { label: 'Published', match: ['Published'] },
      all: { label: 'All', match: null },
    };
    let token = store('get');
    let data = null;
    let tab = 'review';

    // ---- Session ----

    function store(op, value) {
      try {
        if (op === 'get') return localStorage.getItem('dashboardToken');
        if (op === 'set') localStorage.setItem('dashboardToken', value);
        if (op === 'clear') localStorage.removeItem('dashboardToken');
      } catch (e) { /* Storage blocked: the session lasts until the page closes. */ }
      return null;
    }

    function call(fn, args, onDone, onError) {
      google.script.run
        .withSuccessHandler(onDone || function () {})
        .withFailureHandler(function (e) {
          const msg = e && e.message ? e.message : String(e);
          if (msg.indexOf('SIGNED_OUT') >= 0) return signedOut('Your session ended. Please sign in again.');
          (onError || fail)(msg);
        })[fn].apply(null, [token].concat(args || []));
    }

    function signedOut(message) {
      token = null;
      store('clear');
      document.getElementById('appView').hidden = true;
      document.getElementById('loginView').hidden = false;
      document.getElementById('loginError').textContent = message || '';
      document.getElementById('username').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      google.script.run
        .withSuccessHandler(function (res) {
          token = res.token;
          store('set', token);
          document.getElementById('password').value = '';
          btn.disabled = false;
          btn.textContent = 'Sign in';
          load();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Sign in';
          document.getElementById('loginError').textContent = err && err.message ? err.message : String(err);
        })
        .login(document.getElementById('username').value, document.getElementById('password').value);
    });

    document.getElementById('logoutBtn').onclick = function () {
      google.script.run.logout(token);
      signedOut();
    };

    // ---- Data ----

    function load() {
      if (!token) return signedOut();
      call('getPosts', [], render);
    }

    function groupOf(p) {
      for (const key of ['review', 'scheduled', 'published']) {
        if (GROUPS[key].match.indexOf(p.status) >= 0) return key;
      }
      return 'other';
    }

    function render(res) {
      data = res;
      document.getElementById('loginView').hidden = true;
      document.getElementById('appView').hidden = false;
      document.getElementById('who').textContent = 'Signed in as ' + res.username;

      const counts = { review: 0, scheduled: 0, published: 0, all: res.posts.length };
      res.posts.forEach(function (p) { if (counts[groupOf(p)] !== undefined) counts[groupOf(p)]++; });
      const month = res.now.slice(0, 7);
      const next = res.posts.filter(function (p) { return p.status === 'Approved' && p.postAt; })
        .map(function (p) { return p.postAt; }).sort()[0];
      document.getElementById('statReview').textContent = counts.review;
      document.getElementById('statScheduled').textContent = counts.scheduled;
      document.getElementById('statNext').textContent = next ? 'Next: ' + nice(next) : 'Scheduled';
      document.getElementById('statPublished').textContent =
        res.posts.filter(function (p) { return p.status === 'Published' && p.publishedAt.indexOf(month) === 0; }).length;
      const st = res.settings;
      document.getElementById('hint').textContent = 'Times are IST (now ' + nice(res.now) + '). ' +
        (st.defaultTime ? 'Approved posts go out at ' + clock(st.defaultTime) + ' by default' : 'Approved posts go out right away by default') +
        ', at most ' + st.maxPerDay + ' a day. Change this in Settings.';

      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      Object.keys(GROUPS).forEach(function (key) {
        const b = document.createElement('button');
        b.className = 'tab' + (key === tab ? ' on' : '');
        b.innerHTML = GROUPS[key].label + '<span class="n">' + counts[key] + '</span>';
        b.onclick = function () { tab = key; render(data); };
        tabs.appendChild(b);
      });

      const list = document.getElementById('list');
      list.innerHTML = '';
      const shown = res.posts.filter(function (p) { return tab === 'all' || groupOf(p) === tab; });
      if (!shown.length) {
        list.innerHTML = '<div class="empty">' + {
          review: 'Nothing to review. The next draft arrives at 08:00 IST, or click "Write a new draft".',
          scheduled: 'Nothing scheduled.', published: 'Nothing published yet.', all: 'No posts yet.' }[tab] + '</div>';
        return;
      }
      shown.forEach(function (p) { list.appendChild(card(p)); });
    }

    // ---- Cards ----

    function pill(status) {
      const cls = { 'Pending review': 'review', 'Post manually': 'review', 'Approved': 'scheduled', 'Publishing': 'scheduled',
        'Published': 'published', 'Rejected': 'bad', 'Failed': 'bad' }[status] || 'review';
      const label = status === 'Approved' ? 'Scheduled' : status;
      return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
    }

    function card(p) {
      const locked = p.status === 'Publishing' || p.status === 'Published';
      const scheduled = p.status === 'Approved';
      const el = document.createElement('div');
      el.className = 'card';
      let sub = 'Drafted ' + nice(p.date);
      if (p.status === 'Published') sub = 'Posted ' + nice(p.publishedAt);
      else if (scheduled) sub = p.postAt ? 'Goes out ' + nice(p.postAt) : 'Going out in the next few minutes';
      el.innerHTML =
        '<div class="card-head"><h3><span class="t"></span><div class="sub">' + esc(sub) + '</div></h3>' + pill(p.status) + '</div>' +
        '<div class="editor"><textarea ' + (locked ? 'readonly' : '') + '></textarea><div class="count"></div></div>' +
        (locked ? '' :
          '<div class="when"><label>Post at</label><input type="datetime-local" value="' + esc(p.postAt.replace(' ', 'T')) + '">' +
          '<span class="note">' + (data.nextSlot ? 'Leave empty to use the next free slot: ' + esc(nice(data.nextSlot)) + '.'
            : 'Leave empty to post as soon as you approve.') + '</span></div>' +
          '<div class="actions">' +
            '<button class="btn primary" data-act="schedule"></button>' +
            '<button class="btn" data-act="now">Post now</button>' +
            '<button class="btn quiet" data-act="save">Save edits</button>' +
            '<span class="spacer"></span>' +
            (p.status === 'Rejected' ? '<button class="btn quiet" data-act="pending">Back to review</button>'
              : scheduled ? '<button class="btn quiet" data-act="pending">Unschedule</button>'
              : '<button class="btn danger" data-act="reject">Reject</button>') +
          '</div>') +
        (p.notes ? '<div class="notes">' + esc(p.notes) + '</div>' : '') +
        '<div class="meta">' +
          (p.link ? '<a href="' + esc(p.link) + '" target="_blank">View on LinkedIn ↗</a><br>' : '') +
          (p.sources ? 'Based on: ' + p.sources.split('\n').map(function (u) {
            return '<a href="' + esc(u) + '" target="_blank">' + esc(host(u)) + '</a>'; }).join(', ') : '') +
        '</div>';
      el.querySelector('.t').textContent = p.topic || 'Untitled post';
      const ta = el.querySelector('textarea');
      ta.value = p.text;
      const counter = el.querySelector('.count');
      const updateCount = function () {
        counter.textContent = ta.value.length.toLocaleString() + ' / ' + LIMIT.toLocaleString();
        counter.className = 'count' + (ta.value.length > LIMIT ? ' over' : '');
      };
      ta.addEventListener('input', updateCount);
      updateCount();
      const input = el.querySelector('input');
      const main = el.querySelector('[data-act=schedule]');
      if (main) {
        const label = function () { main.textContent = input.value ? (scheduled ? 'Reschedule' : 'Schedule') : 'Approve'; };
        input.addEventListener('input', label);
        label();
      }
      el.querySelectorAll('button[data-act]').forEach(function (b) { b.onclick = function () { act(b.dataset.act, p, el); }; });
      return el;
    }

    function act(action, p, el) {
      const text = el.querySelector('textarea').value;
      const input = el.querySelector('input');
      const postAt = input ? input.value : '';
      if (text.length > LIMIT && ['schedule', 'now'].indexOf(action) >= 0) return toast('The post is longer than LinkedIn allows. Shorten it first.');
      // A date picker with only the time (or only the date) filled in reads as empty, so catch it here.
      if (input && input.validity && input.validity.badInput) return toast('Pick both a date and a time, or clear the Post at box.');
      if (action === 'schedule' && !postAt && data.nextSlot && !confirm('No time picked, so this goes in the next free slot: ' + nice(data.nextSlot) + '. OK?')) return;
      if (action === 'schedule' && postAt && postAt.replace('T', ' ') < data.now) return toast('That time has already passed. Pick a later time, or click Post now.');
      if (action === 'now' && !confirm('Post this to LinkedIn now?')) return;
      el.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      const messages = {
        now: 'Posting now. Refresh in a minute to see the link.',
        save: 'Saved.', reject: 'Rejected.', pending: 'Moved back to review.',
      };
      const done = function (when) {
        if (action === 'schedule') {
          toast(when && when > data.now ? 'Scheduled for ' + nice(when) + '.' : 'Approved. It will go out in the next few minutes.');
        } else {
          toast(messages[action]);
        }
        load();
      };
      const failed = function (msg) { fail(msg); load(); };
      if (action === 'schedule') call('schedulePost', [p.id, text, postAt], done, failed);
      if (action === 'now') call('postNow', [p.id, text], done, failed);
      if (action === 'save') call('savePost', [p.id, text, postAt], done, failed);
      if (action === 'reject') call('setStatus', [p.id, 'Rejected'], done, failed);
      if (action === 'pending') call('setStatus', [p.id, 'Pending review'], done, failed);
    }

    document.getElementById('refreshBtn').onclick = load;
    document.getElementById('draftBtn').onclick = function () {
      const btn = this;
      btn.disabled = true;
      call('draftNow', [], function () { toast('Writing a new draft. Refresh in about a minute.'); btn.disabled = false; },
        function (msg) { fail(msg); btn.disabled = false; });
    };

    // ---- Settings ----

    document.getElementById('settingsBtn').onclick = function () {
      document.getElementById('setTime').value = data.settings.defaultTime;
      document.getElementById('setMax').value = data.settings.maxPerDay;
      document.getElementById('setApply').checked = false;
      document.getElementById('settingsView').hidden = false;
    };
    document.getElementById('settingsCancel').onclick = function () {
      document.getElementById('settingsView').hidden = true;
    };
    document.getElementById('settingsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('settingsSave');
      btn.disabled = true;
      call('saveSettings', [document.getElementById('setTime').value, document.getElementById('setMax').value,
        document.getElementById('setApply').checked], function (res) {
        btn.disabled = false;
        document.getElementById('settingsView').hidden = true;
        toast('Settings saved.' + (res.moved ? ' Moved ' + res.moved + ' scheduled post' + (res.moved > 1 ? 's' : '') + '.' : ''));
        load();
      }, function (msg) { btn.disabled = false; fail(msg); });
    });

    // ---- Helpers ----

    function clock(hhmm) {
      const h = Number(hhmm.slice(0, 2));
      return ((h % 12) || 12) + ':' + hhmm.slice(3, 5) + (h < 12 ? ' am' : ' pm');
    }

    function nice(s) {
      if (!s) return '';
      const m = String(s).replace('T', ' ').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/);
      if (!m) return s;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      let out = Number(m[3]) + ' ' + months[Number(m[2]) - 1];
      if (m[4]) {
        const h = Number(m[4]);
        out += ', ' + ((h % 12) || 12) + ':' + m[5] + (h < 12 ? ' am' : ' pm');
      }
      return out;
    }

    function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

    function toast(message) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.hidden = false;
      clearTimeout(t.timer);
      t.timer = setTimeout(function () { t.hidden = true; }, 4000);
    }

    function fail(message) { toast('Something went wrong: ' + message); }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    token ? load() : signedOut();
  </script>
</body>
</html>
